services:
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: his_app1
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - his_network

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: his_app2
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - his_network

  nginx:
    image: nginx:alpine
    container_name: his_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app1
      - app2
    networks:
      - his_network

  postgres:
    image: postgres:16-alpine
    container_name: his_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: his_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d his_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - his_network

  redis:
    image: redis:7-alpine
    container_name: his_redis
    ports:
      - "6379:6379"
    networks:
      - his_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: his_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - his_network

  audit_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: his_audit_worker
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - his_network

volumes:
  postgres_data:

networks:
  his_network:
    driver: bridge